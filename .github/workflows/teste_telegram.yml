name: Teste Isolado Telegram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enviar mensagem de teste sem realizar reserva
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              raise SystemExit("ERRO: configure TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID nos Repository secrets.")

          mensagem = (
              "✅ TESTE DO TESTE-RESERVA\n"
              "O Telegram foi conectado ao GitHub Actions com sucesso.\n"
              "Esta é apenas uma mensagem de teste. Nenhuma reserva foi realizada."
          )
          url = "https://api.telegram.org/bot" + token + "/sendMessage"
          dados = urllib.parse.urlencode({"chat_id": chat_id, "text": mensagem}).encode("utf-8")
          req = urllib.request.Request(url, data=dados, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=20) as resposta:
                  corpo = json.load(resposta)
              if not corpo.get("ok"):
                  raise SystemExit("ERRO: o Telegram nao confirmou o envio. Confira o chat ID e se deu /start no bot.")
          except urllib.error.HTTPError as erro:
              # Exibir somente codigos e descricoes conhecidas, nunca token ou URL.
              try:
                  corpo_erro = json.loads(erro.read().decode("utf-8"))
                  descricao = str(corpo_erro.get("description", ""))
              except (ValueError, UnicodeError):
                  descricao = ""
              mensagens = {
                  "Forbidden: bot was blocked by the user": "O usuario bloqueou o bot: desbloqueie-o e envie /start.",
                  "Forbidden: bot can't initiate conversation with a user": "A conta de destino ainda nao iniciou conversa com ESTE bot.",
                  "Forbidden: bot can't send messages to bots": "O Chat ID pertence a outro bot e nao a uma conta pessoal.",
                  "Forbidden: bot was kicked from the group chat": "O bot foi removido do grupo.",
                  "Forbidden: bot is not a member of the supergroup chat": "O bot nao participa desse grupo.",
                  "Forbidden: bot is not a member of the channel chat": "O bot nao participa desse canal.",
                  "Bad Request: chat not found": "Chat ID incorreto, ou conversa nao acessivel pelo bot.",
                  "Unauthorized": "Token do bot invalido ou revogado.",
              }
              print(f"ERRO: Telegram HTTP {erro.code}.")
              print("Diagnostico: " + mensagens.get(descricao, "Confira se o token e o Chat ID pertencem ao mesmo bot/conversa."))
              raise SystemExit(1)
          except urllib.error.URLError:
              raise SystemExit("ERRO: nao foi possivel conectar a API do Telegram.")
          print("SUCESSO: mensagem de teste enviada ao Telegram. Nenhuma reserva foi realizada.")
          PY
