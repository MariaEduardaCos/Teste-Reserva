name: Reserva Universitária Automática

on:
  workflow_dispatch:
    inputs:
      onibus:
        description: "Número do ônibus (1=Dheimes/0542, 2=Adalberto/0519, 3=Edson/0507)"
        required: false
        default: ""
      forcar:
        description: "Forçar execução mesmo fora do horário?"
        type: boolean
        default: false

  schedule:
    # DOMINGO: Disparos antecipados para vencer a fila do GitHub.
    # 17:35h BRT (20:35 UTC) e 17:50h BRT (20:50 UTC).
    # A máquina inicia na nuvem, aguarda calmamente até 17:58:00 BRT e dispara a cada 2s até abrir às 18:00h!
    - cron: "35 20 * * 0"
    - cron: "50 20 * * 0"

    # SEGUNDA A QUINTA-FEIRA: Disparos antecipados para vencer a fila do GitHub.
    # 21:35h BRT (00:35 UTC de Terça a Sexta) e 21:50h BRT (00:50 UTC de Terça a Sexta).
    # A máquina inicia na nuvem, aguarda calmamente até 21:58:00 BRT e dispara a cada 2s até abrir às 22:00h!
    # OBS: Sexta-feira à noite NÃO roda (sem aula no sábado).
    - cron: "35 0 * * 2-5"
    - cron: "50 0 * * 2-5"

concurrency:
  group: reserva-unirv
  cancel-in-progress: false

jobs:
  reservar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Executar Bot de Reserva
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.onibus }}" ]; then
            ARGS="$ARGS --onibus ${{ github.event.inputs.onibus }}"
          fi
          if [ "${{ github.event.inputs.forcar }}" = "true" ]; then
            ARGS="$ARGS --forcar"
          fi
          python3 -u bot_teste_local.py $ARGS
