name: Reserva Universitária Automática

on:
  workflow_dispatch:
    inputs:
      onibus:
        description: "Número do ônibus (1=Dheimes/0542, 2=Adalberto/0519, 3=Edson/0507)"
        required: false
        default: ""
      forcar:
        description: "Forçar execução mesmo fora do horário?"
        type: boolean
        default: false

  schedule:
    # DOMINGO: Disparos antecipados para vencer a fila do GitHub.
    # 17:35h BRT (20:35 UTC) e 17:50h BRT (20:50 UTC).
    # A máquina inicia na nuvem, aguarda calmamente até 17:58:00 BRT e dispara a cada 2s até abrir às 18:00h!
    - cron: "35 20 * * 0"
    - cron: "50 20 * * 0"

    # SEGUNDA A QUINTA-FEIRA: Disparos antecipados para vencer a fila do GitHub.
    # 21:35h BRT (00:35 UTC de Terça a Sexta) e 21:50h BRT (00:50 UTC de Terça a Sexta).
    # A máquina inicia na nuvem, aguarda calmamente até 21:58:00 BRT e dispara a cada 2s até abrir às 22:00h!
    # OBS: Sexta-feira à noite NÃO roda (sem aula no sábado).
    - cron: "35 0 * * 2-5"
    - cron: "50 0 * * 2-5"

concurrency:
  group: reserva-unirv
  cancel-in-progress: false

jobs:
  reservar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Executar Bot de Reserva
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.onibus }}" ]; then
            ARGS="$ARGS --onibus ${{ github.event.inputs.onibus }}"
          fi
          if [ "${{ github.event.inputs.forcar }}" = "true" ]; then
            ARGS="$ARGS --forcar"
          fi
          python3 -u bot_teste_local.py $ARGS

      # O repositorio e publico: nunca publicar comprovantes sem criptografia.
      - name: Criptografar comprovante para o GitHub
        if: ${{ always() }}
        env:
          COMPROVANTE_SENHA: ${{ secrets.COMPROVANTE_SENHA }}
        shell: bash
        run: |
          if [ -f comprovantes/comprovante.json ]; then
            if [ -z "$COMPROVANTE_SENHA" ]; then
              echo "COMPROVANTE_SENHA ausente; comprovante nao sera publicado no GitHub."
              rm -rf comprovantes
              exit 0
            fi
            mkdir -p comprovante-protegido
            printf '%s' "$COMPROVANTE_SENHA" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 --output comprovante-protegido/comprovante.json.gpg comprovantes/comprovante.json
            rm -rf comprovantes
            echo "Comprovante criptografado gerado."
          fi

      - name: Guardar comprovante criptografado (30 dias)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: comprovante-reserva-${{ github.run_id }}
          path: comprovante-protegido/comprovante.json.gpg
          if-no-files-found: ignore
          retention-days: 30
