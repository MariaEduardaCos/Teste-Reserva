name: Reserva Universitária Automática

on:
  # Permite disparar manualmente pelo GitHub escolhendo o ônibus se desejar
  workflow_dispatch:
    inputs:
      onibus:
        description: "Número do ônibus (1=Dheimes/0542, 2=Adalberto/0519, 3=Edson/0507)"
        required: false
        default: ""
      forcar:
        description: "Forçar execução mesmo fora do horário?"
        type: boolean
        default: false

  schedule:
    # DOMINGO: Inicia a máquina na nuvem às 17:54h BRT (20:54 UTC) para absorver fila do GitHub,
    # aguarda até 17:58:00 BRT e recarrega a cada 2s até abrir às 18:00h (reserva p/ Segunda-feira).
    - cron: "54 20 * * 0"

    # SEGUNDA A QUINTA-FEIRA: Inicia a máquina às 21:54h BRT (00:54 UTC de Terça a Sexta),
    # aguarda até 21:58:00 BRT e recarrega a cada 2s até abrir às 22:00h (reserva p/ o dia seguinte).
    # OBS: Sexta-feira à noite NÃO roda pois não há aula no sábado!
    - cron: "54 0 * * 2-5"

jobs:
  reservar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Executar Bot de Reserva
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.onibus }}" ]; then
            ARGS="$ARGS --onibus ${{ github.event.inputs.onibus }}"
          fi
          if [ "${{ github.event.inputs.forcar }}" = "true" ]; then
            ARGS="$ARGS --forcar"
          fi
          python3 -u bot_teste_local.py $ARGS
