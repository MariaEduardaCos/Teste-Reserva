name: Reserva Universitária Automática

on:
  # Permite disparar manualmente pelo GitHub escolhendo o ônibus se desejar
  workflow_dispatch:
    inputs:
      onibus:
        description: "Número do ônibus (1=Dheimes/0542, 2=Adalberto/0519, 3=Edson/0507)"
        required: false
        default: ""
      forcar:
        description: "Forçar execução mesmo fora do horário?"
        type: boolean
        default: false

  schedule:
    # DOMINGO às 17:58h (Horário de Brasília UTC-3 -> 20:58 UTC)
    # Reserva para a aula de Segunda-feira (lista abre às 18:00h BRT)
    - cron: "58 20 * * 0"

    # SEGUNDA A QUINTA-FEIRA às 21:58h (Horário de Brasília UTC-3 -> 00:58 UTC de Terça a Sexta)
    # Reserva para o dia seguinte (Terça, Quarta, Quinta e Sexta-feira - lista abre às 22:00h BRT)
    # OBS: Sexta-feira à noite NÃO roda pois não há aula no sábado!
    - cron: "58 0 * * 2-5"

jobs:
  reservar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Executar Bot de Reserva
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.onibus }}" ]; then
            ARGS="$ARGS --onibus ${{ github.event.inputs.onibus }}"
          fi
          if [ "${{ github.event.inputs.forcar }}" = "true" ]; then
            ARGS="$ARGS --forcar"
          fi
          python3 bot_teste_local.py $ARGS
